<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YARVIS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YARVIS">
<meta name="theme-color" content="#0B0C10">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
/* Selbst gehostete Schriften: Space Grotesk + Material Symbols (Subset) */
@font-face { font-family: 'Space Grotesk'; font-weight: 400; font-style: normal; src: url('./sg-400.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Space Grotesk'; font-weight: 500; font-style: normal; src: url('./sg-500.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Space Grotesk'; font-weight: 600 800; font-style: normal; src: url('./sg-700.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'MSR'; font-style: normal; src: url('./msr.woff2') format('woff2'); font-display: block; }
.msr {
  font-family: 'MSR' !important; font-weight: normal; font-style: normal;
  display: inline-block; line-height: 1; letter-spacing: normal;
  vertical-align: -0.14em; -webkit-font-smoothing: antialiased;
}
</style>
<style>
:root {
  --accent: #5B7CFA;
  --accent-soft: rgba(91,124,250,.14);
  --accent-grad: linear-gradient(135deg, #5B7CFA 0%, #8A5CF6 100%);
  --bg: #F2F3F7;
  --card: #FFFFFF;
  --card-2: #F7F8FB;
  --text: #0B0C10;
  --text-2: #6B7080;
  --text-3: #9AA0AE;
  --line: rgba(20,22,30,.08);
  --danger: #E5484D;
  --ok: #2FA46A;
  --warn: #E8930C;
  --shadow: 0 1px 2px rgba(15,20,40,.04), 0 8px 24px rgba(15,20,40,.06);
  --sheet-bg: #FFFFFF;
  --blur-bg: rgba(242,243,247,.72);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0B0C10;
  --card: #16181F;
  --card-2: #1D2029;
  --text: #F2F3F7;
  --text-2: #9AA0AE;
  --text-3: #6B7080;
  --line: rgba(240,242,250,.08);
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
  --sheet-bg: #16181F;
  --blur-bg: rgba(11,12,16,.72);
  --accent-soft: rgba(91,124,250,.18);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  transition: background .3s ease, color .3s ease;
}
input, textarea { -webkit-user-select: text; user-select: text; }

/* ---------- App shell ---------- */
#app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.views { flex: 1; position: relative; overflow: hidden; }
.view {
  position: absolute; inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--sat) + 14px) 18px calc(max(10px, var(--sab)) + 86px);
  opacity: 0; transform: translateY(6px) scale(.995);
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
}
.view.active { opacity: 1; transform: none; pointer-events: auto; }

/* ---------- Headers ---------- */
.page-head { margin-bottom: 18px; }
.page-eyebrow { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; text-transform: uppercase; }
.page-title { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: var(--card); color: var(--text);
  display: grid; place-items: center; font-size: 17px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
}
.icon-btn:active { transform: scale(.9); }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 14px;
  border: 1px solid var(--line);
}
.card-title { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.card-title .mini-link { color: var(--accent); font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; cursor: pointer; }

/* ---------- Hero (Heute) ---------- */
.hero {
  border-radius: 24px; padding: 22px 20px; color: #fff;
  background: var(--accent-grad);
  box-shadow: 0 12px 30px rgba(91,124,250,.35);
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -60px;
  width: 180px; height: 180px; border-radius: 50%;
  background: rgba(255,255,255,.12);
}
.hero::before {
  content: ""; position: absolute; right: 30px; bottom: -70px;
  width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255,255,255,.08);
}
.hero .greet { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.hero .sub { font-size: 14px; opacity: .85; margin-top: 4px; font-weight: 500; }
.hero .stats { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hero .stat {
  flex: 1; background: rgba(255,255,255,.16); border-radius: 14px;
  padding: 10px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.hero .stat b { display: block; font-size: 20px; font-weight: 800; }
.hero .stat span { font-size: 11.5px; opacity: .85; font-weight: 600; }

/* ---------- Empty states ---------- */
.empty { text-align: center; padding: 22px 10px; color: var(--text-3); font-size: 14px; font-weight: 500; }
.empty .e-icon { font-size: 30px; display: block; margin-bottom: 8px; }

/* ---------- Tasks ---------- */
.task-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.task-row:last-child { border-bottom: none; }
.check {
  width: 24px; height: 24px; min-width: 24px; border-radius: 50%;
  border: 2px solid var(--text-3); display: grid; place-items: center;
  color: transparent; font-size: 13px; cursor: pointer;
  transition: all .18s ease;
}
.task-row.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.task-main { flex: 1; min-width: 0; cursor: pointer; }
.task-title { font-size: 15.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .18s, opacity .18s; }
.task-row.done .task-title { text-decoration: line-through; color: var(--text-3); }
.task-meta { font-size: 12.5px; color: var(--text-2); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.task-meta .overdue { color: var(--danger); font-weight: 600; }
.prio-dot { width: 8px; height: 8px; min-width: 8px; border-radius: 50%; }
.prio-hoch { background: var(--danger); }
.prio-mittel { background: var(--warn); }
.prio-niedrig { background: var(--text-3); }

.seg {
  display: flex; background: var(--card); border-radius: 12px; padding: 3px;
  margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line);
}
.seg button {
  flex: 1; border: none; background: transparent; padding: 8px 4px;
  border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--text-2);
  cursor: pointer; transition: all .18s ease; font-family: inherit;
}
.seg button.on { background: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(91,124,250,.35); }

/* ---------- Kalender ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head .cal-month { font-size: 17px; font-weight: 700; }
.cal-nav { display: flex; gap: 8px; }
.cal-nav button {
  width: 32px; height: 32px; border-radius: 10px; border: none;
  background: var(--card-2); color: var(--text); font-size: 15px; cursor: pointer;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-3); padding: 4px 0; text-transform: uppercase; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; position: relative;
  transition: background .15s ease, transform .1s ease; border: none; background: transparent; color: var(--text); font-family: inherit;
}
.cal-day:active { transform: scale(.92); }
.cal-day.other { color: var(--text-3); opacity: .45; }
.cal-day.today { color: var(--accent); font-weight: 800; }
.cal-day.sel { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(91,124,250,.4); }
.cal-day .dots { display: flex; gap: 2px; position: absolute; bottom: 5px; }
.cal-day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cal-day.sel .dot { background: #fff; }
.ev-row { display: flex; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); align-items: center; cursor: pointer; }
.ev-row:last-child { border-bottom: none; }
.ev-bar { width: 4px; border-radius: 3px; align-self: stretch; min-height: 36px; }
.ev-time { font-size: 12.5px; font-weight: 700; color: var(--text-2); min-width: 44px; }
.ev-main { flex: 1; min-width: 0; }
.ev-title { font-size: 15px; font-weight: 600; }
.ev-notes { font-size: 12.5px; color: var(--text-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Links ---------- */
.links-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.link-tile { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; border: none; background: none; font-family: inherit; padding: 0; }
.link-ic {
  width: 58px; height: 58px; border-radius: 17px; display: grid; place-items: center;
  font-size: 25px; color: #fff; box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.link-tile:active .link-ic { transform: scale(.88); }
.link-label { font-size: 11.5px; font-weight: 600; color: var(--text-2); max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-tile.add .link-ic { background: var(--card); color: var(--text-2); border: 1.5px dashed var(--text-3); box-shadow: none; }
.links-hscroll { display: flex; gap: 13px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.links-hscroll::-webkit-scrollbar { display: none; }

/* ---------- Notizen ---------- */
.note-card { cursor: pointer; }
.note-text { font-size: 15px; font-weight: 500; line-height: 1.45; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: hidden; }
.note-date { font-size: 12px; color: var(--text-3); margin-top: 8px; font-weight: 600; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 8px 10px calc(var(--sab) + 8px);
  background: var(--blur-bg);
  backdrop-filter: saturate(180%) blur(22px);
  -webkit-backdrop-filter: saturate(180%) blur(22px);
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-around;
}
.tab {
  border: none; background: none; font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3); font-size: 10.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 12px; transition: color .18s ease, transform .12s ease;
  min-width: 58px;
}
.tab:active { transform: scale(.92); }
.tab .t-ic { line-height: 0; }
.tab .t-ic svg { width: 23px; height: 23px; }
.tab.on { color: var(--accent); }

/* ---------- FAB ---------- */
.fab {
  position: fixed; right: 18px; bottom: calc(var(--sab) + 84px); z-index: 41;
  width: 56px; height: 56px; border-radius: 50%; border: none;
  background: var(--accent-grad); color: #fff; font-size: 26px;
  box-shadow: 0 10px 24px rgba(91,124,250,.45);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
}
.fab:active { transform: scale(.88); }
.fab.hidden { transform: scale(0); opacity: 0; pointer-events: none; }

/* ---------- Sheet (bottom modal) ---------- */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(8,9,14,.45);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  background: var(--sheet-bg); border-radius: 24px 24px 0 0;
  padding: 10px 20px calc(var(--sab) + 20px);
  transform: translateY(105%); transition: transform .32s cubic-bezier(.32,.72,.24,1), visibility 0s .35s;
  visibility: hidden;
  max-height: 88dvh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,.2);
}
.sheet.open { transform: translateY(0); visibility: visible; transition: transform .32s cubic-bezier(.32,.72,.24,1); }
.grip { width: 38px; height: 4.5px; border-radius: 3px; background: var(--text-3); opacity: .4; margin: 4px auto 14px; }
.sheet h3 { font-size: 19px; font-weight: 800; margin-bottom: 16px; letter-spacing: -.01em; }
.f-label { font-size: 12.5px; font-weight: 700; color: var(--text-2); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
.f-input, .f-area {
  width: 100%; border: 1.5px solid var(--line); background: var(--card-2);
  border-radius: 13px; padding: 13px 14px; font-size: 16px; color: var(--text);
  font-family: inherit; outline: none; transition: border-color .15s ease;
}
.f-input:focus, .f-area:focus { border-color: var(--accent); }
.f-area { min-height: 90px; resize: vertical; }
.f-row { display: flex; gap: 10px; }
.f-row > * { flex: 1; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--line); background: var(--card-2); color: var(--text-2);
  border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all .15s ease;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.color-row { display: flex; gap: 10px; }
.color-dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform .12s ease; }
.color-dot.on { border-color: var(--text); transform: scale(1.1); }
.btn {
  width: 100%; border: none; border-radius: 15px; padding: 15px;
  font-size: 16.5px; font-weight: 700; font-family: inherit; cursor: pointer;
  margin-top: 20px; transition: transform .13s ease, opacity .15s ease;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent-grad); color: #fff; box-shadow: 0 8px 20px rgba(91,124,250,.35); }
.btn-ghost-danger { background: transparent; color: var(--danger); margin-top: 6px; padding: 12px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--sab) + 100px); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--bg);
  padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 600;
  pointer-events: none; transition: all .3s cubic-bezier(.34,1.3,.64,1);
  box-shadow: 0 8px 24px rgba(0,0,0,.25); white-space: nowrap;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ---------- Settings ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: none; }
.set-label { font-size: 15.5px; font-weight: 600; }
.theme-seg { display: flex; background: var(--card-2); border-radius: 10px; padding: 3px; }
.theme-seg button { border: none; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; font-family: inherit; }
.theme-seg button.on { background: var(--accent); color: #fff; }

/* ---------- Kategorien ---------- */
.cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  border: 1.5px solid var(--line); background: var(--card-2); color: var(--text-2);
  border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all .15s ease; flex: 0 0 auto;
}
.cat-chip.on { color: #fff; border-color: transparent; }
.cat-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
  color: #fff; letter-spacing: .01em;
}

/* ---------- Ziele & Projekte ---------- */
.proj-row { padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.proj-row:last-child { border-bottom: none; }
.proj-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.proj-title { font-size: 15.5px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-pct { font-size: 13px; font-weight: 800; color: var(--accent); }
.proj-bar { height: 7px; border-radius: 4px; background: var(--card-2); margin-top: 8px; overflow: hidden; }
.proj-bar > div { height: 100%; border-radius: 4px; background: var(--accent-grad); transition: width .5s cubic-bezier(.34,1.1,.44,1); min-width: 4px; }
.proj-meta { display: flex; gap: 8px; align-items: center; margin-top: 7px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
.proj-done-badge { color: var(--ok); font-weight: 700; }

/* Meilensteine im Sheet */
.ms-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ms-row:last-child { border-bottom: none; }
.ms-row .check { width: 21px; height: 21px; min-width: 21px; font-size: 11px; }
.ms-row.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.ms-title { flex: 1; font-size: 14.5px; font-weight: 600; }
.ms-row.done .ms-title { text-decoration: line-through; color: var(--text-3); }
.ms-del { border: none; background: none; color: var(--text-3); font-size: 15px; cursor: pointer; padding: 4px; }
.ms-add { display: flex; gap: 8px; margin-top: 10px; }
.ms-add .f-input { flex: 1; padding: 10px 12px; font-size: 14.5px; }
.ms-add button { border: none; border-radius: 11px; background: var(--accent); color: #fff; width: 44px; font-size: 19px; cursor: pointer; }

/* ---------- Gewohnheiten ---------- */
.habit-row { padding: 11px 2px; border-bottom: 1px solid var(--line); }
.habit-row:last-child { border-bottom: none; }
.habit-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.habit-name { font-size: 15px; font-weight: 700; flex: 1; cursor: pointer; }
.streak { font-size: 12.5px; font-weight: 800; color: var(--warn); background: rgba(232,147,12,.12); border-radius: 999px; padding: 3px 9px; }
.habit-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.hw-day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hw-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; }
.hw-dot {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--card-2); display: grid; place-items: center; font-size: 13px;
  color: transparent; cursor: default; transition: all .18s ease;
}
.hw-dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.hw-dot.today { border-color: var(--accent); cursor: pointer; }
.hw-dot.today:active { transform: scale(.85); }
.hw-dot.future { opacity: .35; }

/* Heute: Gewohnheiten-Schnellzeile */
.home-habits { display: flex; flex-direction: column; gap: 2px; }
.hh-row { display: flex; align-items: center; gap: 12px; padding: 8px 2px; }
.hh-check {
  width: 30px; height: 30px; min-width: 30px; border-radius: 50%;
  border: 2px solid var(--text-3); display: grid; place-items: center;
  color: transparent; font-size: 14px; cursor: pointer; transition: all .18s ease;
}
.hh-row.done .hh-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.hh-name { flex: 1; font-size: 15px; font-weight: 600; }
.hh-row.done .hh-name { color: var(--text-3); }

/* Auswahl-Sheet */
.choose-btn {
  display: flex; align-items: center; gap: 14px; width: 100%;
  border: 1.5px solid var(--line); background: var(--card-2); border-radius: 16px;
  padding: 15px; margin-bottom: 10px; cursor: pointer; font-family: inherit; text-align: left;
  transition: transform .12s ease;
}
.choose-btn:active { transform: scale(.97); }
.choose-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; color: #fff; }
.choose-t b { display: block; font-size: 15.5px; font-weight: 700; color: var(--text); }
.choose-t span { font-size: 12.5px; color: var(--text-2); font-weight: 500; }

/* Kalender: Tage mit Terminen + Wochenansicht */
.cal-day.has { background: var(--lime); color: #131316; font-weight: 800; }
[data-theme="dark"] .cal-day.has { background: rgba(217,242,79,.2); color: var(--lime); }
.cal-day.has .dot { background: #131316; }
[data-theme="dark"] .cal-day.has .dot { background: var(--lime); }
.cal-day.sel.has { background: var(--pill); color: var(--pill-text); }
.cal-grid.week .cal-day { aspect-ratio: auto; padding: 14px 0 16px; }

/* ---------- Mic FAB ---------- */
.fab-mic {
  position: fixed; right: 18px; bottom: calc(var(--sab) + 150px); z-index: 41;
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); color: var(--accent);
  box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
}
.fab-mic svg { width: 22px; height: 22px; }
.fab-mic:active { transform: scale(.88); }
.fab-mic.hidden { transform: scale(0); opacity: 0; pointer-events: none; }

/* ---------- Capture ---------- */
.cap-mic-btn {
  width: 84px; height: 84px; border-radius: 50%; border: none; margin: 6px auto 4px;
  background: var(--accent-grad); color: #fff; display: grid; place-items: center;
  box-shadow: 0 10px 28px rgba(91,124,250,.4); cursor: pointer; position: relative;
  transition: transform .15s ease;
}
.cap-mic-btn svg { width: 34px; height: 34px; }
.cap-mic-btn:active { transform: scale(.92); }
.cap-mic-btn.rec { background: linear-gradient(135deg, #E5484D, #F0648A); box-shadow: 0 10px 28px rgba(229,72,77,.45); }
.cap-mic-btn.rec::before, .cap-mic-btn.rec::after {
  content: ""; position: absolute; inset: -8px; border-radius: 50%;
  border: 2px solid rgba(229,72,77,.5); animation: pulse 1.6s ease-out infinite;
}
.cap-mic-btn.rec::after { animation-delay: .8s; }
@keyframes pulse { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
.cap-wrap { text-align: center; }
.cap-status { font-size: 13.5px; font-weight: 600; color: var(--text-2); margin: 8px 0 2px; min-height: 18px; }
.cap-live {
  min-height: 44px; margin-top: 10px; font-size: 15.5px; font-weight: 500; line-height: 1.45;
  color: var(--text); text-align: left; background: var(--card-2); border-radius: 13px; padding: 12px 14px;
  white-space: pre-wrap; word-break: break-word;
}
.cap-live:empty::before { content: "Sprich einfach los – oder tippe unten deinen Text."; color: var(--text-3); }
.prop-card {
  border: 1.5px solid var(--line); border-radius: 16px; padding: 13px; margin-top: 12px;
  background: var(--card-2); text-align: left;
}
.prop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.prop-type { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.prop-type::-webkit-scrollbar { display: none; }
.prop-type .chip { white-space: nowrap; flex: 0 0 auto; }
.prop-type .chip { padding: 5px 11px; font-size: 12.5px; }
.prop-del { border: none; background: none; color: var(--text-3); font-size: 16px; cursor: pointer; padding: 4px; }
.prop-card .f-input { margin-bottom: 8px; }
.prop-when { display: flex; gap: 8px; margin-bottom: 8px; }
.prop-when .f-input { margin-bottom: 0; padding: 10px 12px; font-size: 14.5px; }

@media (min-width: 700px) {
  .view { max-width: 520px; margin: 0 auto; }
}

/* ═══════════ V5 DESIGN — Ivory · Lime · Lavendel ═══════════ */
:root {
  --bg: #F2F0E7;
  --card: #FFFFFF;
  --card-2: #EFECE2;
  --text: #131316;
  --text-2: #71717A;
  --text-3: #A6A6AE;
  --line: rgba(19,19,22,.07);
  --lime: #D9F24F;
  --lav: #BCA7FA;
  --accent: #7C5CF6;
  --accent-soft: rgba(124,92,246,.13);
  --accent-grad: linear-gradient(135deg, #BCA7FA 0%, #A78BFA 100%);
  --pill: #131316;
  --pill-text: #F6F5EF;
  --nav-bg: rgba(19,19,22,.94);
  --shadow: 0 1px 2px rgba(19,19,22,.03), 0 10px 30px rgba(19,19,22,.07);
  --sheet-bg: #FAF9F4;
  --blur-bg: rgba(242,240,231,.7);
}
[data-theme="dark"] {
  --bg: #0E0E11;
  --card: #1A1A1F;
  --card-2: #232329;
  --text: #F4F3EC;
  --text-2: #9C9CA5;
  --text-3: #6A6A73;
  --line: rgba(244,243,236,.07);
  --accent: #A78BFA;
  --accent-soft: rgba(167,139,250,.16);
  --pill: #F4F3EC;
  --pill-text: #131316;
  --nav-bg: rgba(26,26,31,.94);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.4);
  --sheet-bg: #1A1A1F;
  --blur-bg: rgba(14,14,17,.7);
}

/* Viewport-Fix: App misst ihre sichtbare Höhe selbst (--vh per JS),
   alle unteren Elemente hängen absolut an der ECHTEN Unterkante */
html, body { height: 100%; overflow: hidden; width: 100%; overscroll-behavior: none; }
html { background: var(--bg); }
#app { position: relative; width: 100%; height: 100%; }

.tabbar, .fab, .fab-mic, .sheet, .toast { position: absolute; }
.sheet-backdrop { position: absolute; inset: 0; }

/* Karten & Radien */
.card { border-radius: 26px; padding: 18px; }
.card-title { letter-spacing: .05em; }

/* Heute: großes Datum + Lime-Glow */
.lime-glow {
  position: absolute; top: -80px; left: -60px; width: 340px; height: 300px;
  background: radial-gradient(closest-side, var(--lime), transparent 70%);
  filter: blur(48px); opacity: .55; pointer-events: none; z-index: 0;
}
[data-theme="dark"] .lime-glow { opacity: .22; }
.hey-row { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
.hey { font-size: 15px; font-weight: 600; color: var(--text-2); }
.hey b { color: var(--text); font-weight: 700; }
.big-date { font-size: 64px; font-weight: 800; letter-spacing: -.045em; line-height: 1.02; margin-top: 10px; position: relative; z-index: 1; }
.big-day { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -.01em; position: relative; z-index: 1; }
.day-sub { font-size: 14px; font-weight: 500; color: var(--text-2); margin: 6px 0 18px; position: relative; z-index: 1; }
.stats-row { display: flex; gap: 10px; margin-bottom: 16px; position: relative; z-index: 1; }
.stat-mini { flex: 1; background: var(--card); border-radius: 20px; padding: 12px 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.stat-mini b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.stat-mini span { font-size: 11px; font-weight: 600; color: var(--text-2); }
.stat-mini.limed { background: var(--lime); border-color: transparent; }
.stat-mini.limed b, .stat-mini.limed span { color: #131316; }

/* Pills: aktive Chips & Segmente werden schwarz (hell) / weiß (dunkel) */
.chip.on { background: var(--pill); border-color: var(--pill); color: var(--pill-text); }
.seg { border-radius: 999px; padding: 4px; }
.seg button { border-radius: 999px; padding: 9px 4px; }
.seg button.on { background: var(--pill); color: var(--pill-text); box-shadow: none; }
.theme-seg button.on { background: var(--pill); color: var(--pill-text); }
.cal-day.sel { background: var(--pill); color: var(--pill-text); box-shadow: none; }
.cal-day.today { color: var(--accent); }

/* Dunkle Tab-Leiste, fest an der Unterkante angedockt */
.tabbar {
  left: 12px; right: 12px;
  bottom: max(0px, var(--sab));
  border-radius: 999px; border: none;
  background: var(--nav-bg);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  padding: 9px 8px;
  box-shadow: 0 12px 34px rgba(19,19,22,.32);
}
[data-theme="dark"] .tabbar { box-shadow: 0 14px 38px rgba(0,0,0,.5); border: 1px solid var(--line); }
.tab { color: #86868E; padding: 6px 14px; font-size: 0; gap: 0; }
.tab .t-ic.msr { font-size: 26px !important; }
.tab.on { color: #F4F1EA; }
.tab.on { color: #FAFAF5; }
[data-theme="dark"] .tab.on { color: #F4F3EC; }
.tab.on .t-ic { animation: tabBounce .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes tabBounce { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (min-width: 700px) { .tabbar { max-width: 520px; left: 50%; transform: translateX(-50%); border-radius: 999px; } }

/* FABs */
.fab {
  background: var(--lav); color: #131316;
  bottom: calc(max(0px, var(--sab)) + 66px);
  box-shadow: 0 12px 28px rgba(167,139,250,.5);
}
.fab-mic {
  background: var(--pill); color: var(--pill-text); border: none;
  bottom: calc(max(0px, var(--sab)) + 130px);
  box-shadow: 0 10px 24px rgba(19,19,22,.3);
}

/* Buttons & Sheets */
.btn { border-radius: 18px; }
.btn-primary { background: var(--lav); color: #131316; box-shadow: 0 8px 22px rgba(167,139,250,.42); }
.sheet { border-radius: 30px 30px 0 0; }
.grip { touch-action: none; width: 44px; padding: 0; }

/* Fortschritt & Streaks */
.proj-bar > div { background: linear-gradient(90deg, var(--lime), #B8E03C); }
.proj-pct { color: var(--text); }
.streak { color: #131316; background: var(--lime); }
.hw-dot.done { background: var(--lime); border-color: var(--lime); color: #131316; }
.hh-row.done .hh-check { background: var(--lime); border-color: var(--lime); color: #131316; }
.task-row.done .check { background: var(--lime); border-color: var(--lime); color: #131316; }

/* Swipe-zum-Löschen (Aufgabenliste) */
.task-swipe { position: relative; overflow: hidden; border-radius: 14px; }
.task-swipe.sw-card { border-radius: 20px; margin-bottom: 14px; }
.task-swipe.sw-card > .card { margin-bottom: 0; }
.task-swipe .task-del-btn { opacity: 0; transition: opacity .15s; }
.task-swipe.dragging .task-del-btn, .task-swipe.revealed .task-del-btn { opacity: 1; }
.task-swipe .task-del-btn {
  position: absolute; right: 0; top: 0; bottom: 0; width: 88px;
  background: var(--danger); color: #fff; border: none; font-size: 20px;
  display: grid; place-items: center; cursor: pointer;
}
.task-swipe > .card { position: relative; z-index: 1; transition: transform .22s cubic-bezier(.32,.72,.25,1); margin-top: 0 !important; }
.task-swipe { margin-top: 12px; }
.task-swipe.dragging > .card { transition: none; }
.task-swipe .task-row {
  background: var(--card); position: relative; z-index: 1;
  transition: transform .22s cubic-bezier(0,0,.2,1);
  touch-action: pan-y; padding-left: 6px; padding-right: 6px;
}
.task-swipe.dragging .task-row { transition: none; }
.task-swipe.removing { transition: opacity .18s cubic-bezier(.4,0,1,1), max-height .25s cubic-bezier(.4,0,1,1) .05s; opacity: 0; max-height: 0 !important; }

/* Gestaffelte Einblendungen beim Tab-Wechsel */
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.view.entering > .card, .view.entering > .page-head, .view.entering > .seg, .view.entering > .stats-row, .view.entering > .big-date, .view.entering > .big-day, .view.entering > .day-sub, .view.entering > .hey-row, .view.entering > #notes-list > .card {
  animation: fadeUp .32s cubic-bezier(0,0,.2,1) both;
}
.view.entering > *:nth-child(2) { animation-delay: .03s; }
.view.entering > *:nth-child(3) { animation-delay: .06s; }
.view.entering > *:nth-child(4) { animation-delay: .09s; }
.view.entering > *:nth-child(5) { animation-delay: .12s; }
.view.entering > *:nth-child(6) { animation-delay: .15s; }
.view.entering > *:nth-child(7) { animation-delay: .18s; }

/* Sheet-Pushback (iOS-Modal-Gefühl) */
.views { transition: transform .34s cubic-bezier(.32,.72,.24,1); transform-origin: 50% 0; }
body.sheet-open .views { transform: scale(.962) translateY(4px); }
body.sheet-open .tabbar, body.sheet-open .fab, body.sheet-open .fab-mic { opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.tabbar, .fab, .fab-mic { transition: opacity .25s ease, transform .18s cubic-bezier(.34,1.56,.64,1); }

/* Checkbox-Pop (Belohnungsmoment) */
@keyframes checkPop { 0% { transform: scale(.6); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
.task-row.done .check, .hh-row.done .hh-check, .hw-dot.done { animation: checkPop .4s cubic-bezier(.34,1.56,.64,1); }

/* Konfetti */
.confetti-p { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; z-index: 90; }

/* Reduzierte Bewegung respektieren */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ═══════════ V6 — Referenz-Layout ═══════════ */
/* Farb-Blobs wie im Referenzbild (Lime + Violett, weich verlaufend) */
.blob-wrap { position: absolute; top: 0; left: 0; right: 0; height: 480px; overflow: hidden; pointer-events: none; z-index: 0; }
.blob { position: absolute; pointer-events: none; filter: blur(52px); }
.blob-lime { top: -70px; left: -50px; width: 380px; height: 320px; background: radial-gradient(closest-side, var(--lime), transparent 72%); opacity: .65; }
.blob-lav { top: 40px; right: -110px; width: 300px; height: 300px; background: radial-gradient(closest-side, var(--lav), transparent 72%); opacity: .5; }
[data-theme="dark"] .blob-lime { opacity: .2; }
[data-theme="dark"] .blob-lav { opacity: .16; }
.lime-glow { display: none; }

/* Profil-Kopfzeile mit Avatar */
.prof-row { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
.prof-l { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--lav) 0%, var(--lime) 130%);
  color: #131316; font-size: 22px; font-weight: 800;
  display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(19,19,22,.14);
}
.hey-hi { font-size: 13.5px; font-weight: 500; color: var(--text-2); }
.hey-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { background: transparent; box-shadow: none; border: none; font-size: 20px; }

/* Datum noch größer, Typo-Kontrast wie Referenz */
.big-date { font-size: 76px; font-weight: 800; letter-spacing: -.05em; line-height: 1; margin-top: 22px; }
.big-day { font-size: 30px; font-weight: 500; color: var(--text); opacity: .92; margin-top: 2px; }
.day-sub { margin: 8px 0 16px; }

/* Filter-Pills unter dem Datum */
.home-filter { position: relative; z-index: 1; margin-bottom: 16px; }
.home-filter .cat-chip { background: var(--card); border-color: transparent; box-shadow: var(--shadow); padding: 9px 16px; font-size: 13.5px; }
.home-filter .cat-chip.on { background: var(--pill); color: var(--pill-text); }

/* Sektions-Titel: kein Uppercase mehr, kräftig wie Referenz */
.card-title { text-transform: none; letter-spacing: -.01em; font-size: 17px; color: var(--text); font-weight: 800; margin-bottom: 14px; }
.card-title .mini-link { font-size: 13.5px; font-weight: 600; }

/* Termin-Karten: 2-spaltig, große Uhrzeit wie „18:15" im Referenzbild */
.ev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ev-card { min-width: 0; }
.ev-card {
  background: var(--card-2); border-radius: 20px; padding: 14px 14px 12px;
  cursor: pointer; position: relative; border: 1px solid var(--line);
  transition: transform .12s ease;
}
.ev-card:active { transform: scale(.96); }
.ev-card.hl { background: var(--card); box-shadow: var(--shadow); }
.ev-card-cat { font-size: 11.5px; font-weight: 700; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
.ev-card-title { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-card-time { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; }
.ev-card-time span { color: var(--text-3); font-weight: 700; }
.ev-card-day { font-size: 12px; font-weight: 600; color: var(--text-2); margin-top: 2px; }
.ev-card .ev-go {
  position: absolute; top: 12px; right: 12px;
  width: 30px; height: 30px; border-radius: 10px;
  background: var(--lav); color: #131316; border: none;
  display: grid; place-items: center; font-size: 14px; pointer-events: none;
}

/* Segment-Filter (Aufgaben) als lose Pills wie Referenz-Chips */
.seg { background: transparent; box-shadow: none; border: none; padding: 0; gap: 8px; }
.seg button { background: var(--card); box-shadow: var(--shadow); flex: 0 1 auto; padding: 10px 18px; }
.seg button.on { background: var(--pill); color: var(--pill-text); }

/* Sheets: dunkle Karte mit Lavendel-CTA wie die „Buy"-Karte im Referenzbild */
.sheet {
  --card: #232329; --card-2: #2A2A31; --text: #F4F3EC; --text-2: #A6A6AE; --text-3: #6E6E76;
  --line: rgba(244,243,236,.09); --accent-soft: rgba(188,167,250,.18);
  --pill: #F4F3EC; --pill-text: #131316;
  background: #17171B; color: var(--text);
  border-radius: 32px 32px 0 0;
  box-shadow: 0 -14px 50px rgba(0,0,0,.4);
}
.sheet .grip { background: #6E6E76; }
.sheet .f-input, .sheet .f-area { border-color: transparent; }
.sheet h3 { color: #F4F3EC; }
.sheet .btn-primary { box-shadow: 0 10px 26px rgba(188,167,250,.3); }
.sheet .color-dot.on { border-color: #F4F3EC; }
.sheet .prop-card { background: #1E1E23; border-color: rgba(244,243,236,.08); }
.sheet .cap-live { background: #2A2A31; }
.sheet .choose-btn { background: #1E1E23; border-color: rgba(244,243,236,.08); }
.sheet .ms-add button { background: var(--lav); color: #131316; }

/* Toast leicht anheben über der Pill-Nav */
.toast { bottom: calc(max(0px, var(--sab)) + 70px); }

/* ═══════════ V7 — Typografie, Icons, Farbe ═══════════ */
body { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; }

/* Typo-Hierarchie: große Sprünge, enge Laufweite, Micro-Labels */
.page-title { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
.page-eyebrow { font-size: 11px; letter-spacing: .14em; }
.f-label { font-size: 11px; letter-spacing: .12em; }
.card-title { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }

/* Kein horizontales Scrollen der Seiten */
.views { overflow: hidden; }
.view { overflow-x: hidden; }

/* Icon-Größen im Kontext */
.tab .t-ic.msr { font-size: 21px; line-height: 1; height: auto; }
.tab { gap: 4px; }
.fab .msr { font-size: 28px; }
.fab-mic .msr { font-size: 22px; }
.icon-btn .msr { font-size: 22px; }
.chip .msr, .cat-chip .msr { font-size: 15px; }
.cat-tag .msr { font-size: 12px; }
.card-title .msr { font-size: 19px; }
.empty .e-icon.msr {
  font-size: 26px; width: 56px; height: 56px; line-height: 56px;
  border-radius: 50%; background: var(--card-2); color: var(--text-2);
  margin: 0 auto 10px;
}
.sheet .empty .e-icon.msr { background: #26262c; }
.streak .msr { font-size: 13px; vertical-align: -0.12em; }
.task-del-btn .msr { font-size: 22px; }

/* Farbgeblockte Termin-Karten (Lime / Lavendel / Karte) */
.ev-card.c-lime { background: var(--lime); border-color: transparent; }
.ev-card.c-lime .ev-card-title, .ev-card.c-lime .ev-card-time, .ev-card.c-lime .ev-card-cat, .ev-card.c-lime .ev-card-day { color: #131316; }
.ev-card.c-lime .ev-card-time span { color: rgba(19,19,22,.4); }
.ev-card.c-lime .ev-go { background: #131316; color: #F4F3EC; }
.ev-card.c-lav { background: var(--lav); border-color: transparent; }
.ev-card.c-lav .ev-card-title, .ev-card.c-lav .ev-card-time, .ev-card.c-lav .ev-card-cat, .ev-card.c-lav .ev-card-day { color: #131316; }
.ev-card.c-lav .ev-card-time span { color: rgba(19,19,22,.4); }
.ev-card.c-lav .ev-go { background: #131316; color: #F4F3EC; }
.ev-card-time { font-size: 34px; }
.ev-card .ev-go .msr { font-size: 16px; }

/* Fokus-Karte: Lavendel-Fläche */
#home-focus-card { background: var(--lav); border-color: transparent; }
#home-focus-card .card-title, #home-focus-card .proj-title, #home-focus-card .proj-pct, #home-focus-card .proj-meta { color: #131316; }
#home-focus-card .card-title .mini-link { color: rgba(19,19,22,.65); }
#home-focus-card .proj-bar { background: rgba(19,19,22,.14); }
#home-focus-card .proj-bar > div { background: #131316; }
#home-focus-card .cat-tag { background: #131316 !important; color: #F4F3EC; }

/* Microinteractions */
.proj-row, .note-card, .ev-row { transition: transform .12s ease, opacity .12s ease; }
.proj-row:active, .note-card:active, .ev-row:active { transform: scale(.98); }
.cat-chip:active, .chip:active, .seg button:active { transform: scale(.94); }
.cat-chip, .chip, .seg button { transition: transform .12s ease, background .18s ease, color .18s ease, border-color .18s ease; }
.tab.on::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--lime); margin-top: 1px; }
.tab::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-top: 1px; }
/* Boden-Elemente an der App-Fläche verankern (die bis zum echten Bildschirmrand reicht) */
.fab, .fab-mic, .toast, .tabbar { position: fixed; }
.sheet { position: fixed; bottom: 0; }
.viewer { position: absolute; }

/* ---------- Vollbild-Viewer ---------- */
.viewer {
  position: fixed; inset: 0; z-index: 70; background: var(--bg);
  transform: translateX(103%); transition: transform .32s cubic-bezier(.32,.72,.25,1);
  display: flex; flex-direction: column;
}
.viewer.open { transform: translateX(0); }
.vw-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(var(--sat) + 10px) 14px 10px;
}
.vw-btn {
  width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--card);
  color: var(--text); font-size: 21px; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 2px 10px rgba(19,19,22,.06);
}
.vw-edit { background: var(--pill); color: var(--pill-text); }
.vw-kind { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.vw-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 20px calc(var(--sab) + 40px); }
.vw-title { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin: 6px 0 14px; }
.vw-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.vw-pill { font-size: 12.5px; font-weight: 700; background: var(--card); border-radius: 999px; padding: 7px 13px; color: var(--text-2); }
.vw-pill b { color: var(--text); }
.vw-text { font-size: 16.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
.vw-sec { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin: 26px 0 10px; }
.vw-link-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--card); border: none; border-radius: 16px; padding: 14px 16px;
  font-family: inherit; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; margin-top: 8px;
}
.vw-link-row .msr { color: var(--lav); font-size: 20px; }
.vw-song-sec { margin: 0 0 22px; }
.vw-song-type { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--lav); margin-bottom: 6px; }
.vw-song-chords { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14.5px; color: #7c9a00; font-weight: 700; margin-bottom: 6px; }
[data-theme="dark"] .vw-song-chords { color: var(--lime); }
.vw-song-lyrics { font-size: 16.5px; line-height: 1.7; white-space: pre-wrap; }

/* ---------- Memo-Player ---------- */
.mp { background: var(--card-2); border-radius: 16px; padding: 14px; margin: 8px 0 10px; }
.sheet .mp { background: #17171B; }
.mp-seek { width: 100%; accent-color: var(--lav); height: 26px; }
.mp-times { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; margin-top: 2px; }
.mp-ctrl { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 8px; }
.mp-b {
  border: none; background: var(--card); color: var(--text); border-radius: 999px;
  min-width: 52px; height: 44px; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
}
.sheet .mp-b { background: #232328; color: #F4F1EA; }
.mp-b.mp-main { width: 58px; height: 58px; min-width: 58px; background: var(--lime); color: #131316; font-size: 26px; display: grid; place-items: center; }
.pause-bars { display: inline-block; width: 14px; height: 16px; border-left: 5px solid currentColor; border-right: 5px solid currentColor; }

/* ---------- Heute: Aufgaben-Tiles (verwandt mit Termin-Karten) ---------- */
.ht-tile {
  display: flex; align-items: center; gap: 12px; background: var(--card-2);
  border-radius: 18px; padding: 13px 15px; margin-top: 10px;
}
[data-theme="dark"] .ht-tile { background: rgba(255,255,255,.05); }
.ht-main { flex: 1; min-width: 0; }
.ht-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ht-tile.done .ht-title { text-decoration: line-through; color: var(--text-3); }
.ht-meta { font-size: 12px; color: var(--text-2); font-weight: 600; margin-top: 3px; display: flex; gap: 7px; align-items: center; }
.ht-time { font-size: 21px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ht-time span { color: var(--text-3); }

/* ---------- Ziele: Meilensteine groß & klar ---------- */
.ms-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 4px; }
.ms-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.ms-row span { font-size: 15px; font-weight: 600; flex: 1; }
.ms-row.done span { text-decoration: line-through; color: var(--text-3); }
.ms-check {
  width: 30px; height: 30px; min-width: 30px; border-radius: 10px; border: 2px solid var(--text-3);
  display: grid; place-items: center; font-size: 15px; color: transparent; cursor: pointer;
}
.ms-row.done .ms-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.num-step { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.num-step button {
  width: 44px; height: 44px; border-radius: 14px; border: none; background: var(--card-2);
  font-size: 22px; font-weight: 700; color: var(--text); cursor: pointer; font-family: inherit;
}
.num-step .num-val { flex: 1; text-align: center; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

.proj-chev { color: var(--text-3); font-size: 20px; transition: transform .22s; display: inline-block; padding: 6px; margin: -6px; }
.proj-chev.open { transform: rotate(90deg); }
.proj-row { cursor: pointer; }
.proj-edit-btn {
  width: 100%; margin-top: 12px; border: none; background: var(--card-2); color: var(--text-2);
  border-radius: 12px; padding: 11px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}

/* ---------- Verknüpfungen ---------- */
.link-chip {
  display: inline-flex; align-items: center; gap: 7px; background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 8px 8px 8px 14px; font-size: 13px; font-weight: 700; margin: 0 6px 8px 0;
}
.link-chip button { border: none; background: none; color: inherit; font-size: 14px; width: 30px; height: 30px; cursor: pointer; }
.pick-row {
  display: block; width: 100%; text-align: left; background: var(--card-2); border: none;
  border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text); cursor: pointer; margin-top: 7px;
}
.sheet .pick-row { background: #17171B; color: #F4F1EA; }

/* ---------- Größere Tap-Flächen ---------- */
.ms-del, .memo-del { width: 42px; height: 42px; display: grid; place-items: center; font-size: 17px; }
.memo-play { width: 46px; height: 46px; min-width: 46px; font-size: 20px; }
.check { width: 30px; height: 30px; min-width: 30px; }
.cal-nav button { width: 44px; height: 44px; }
.hw-dot { width: 34px; height: 34px; }
.ev-go { width: 40px; height: 40px; }
.chip { min-height: 40px; }
.mini-link { padding: 8px 10px; margin: -8px -10px; }

/* ---------- Zeitachse ---------- */
.tl-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; position: relative; }
.tl-row.past { opacity: .38; }
.tl-time { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; width: 46px; color: var(--text-2); }
.tl-bar { width: 4px; height: 30px; border-radius: 3px; }
.tl-main { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.tl-now { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.tl-now .tl-line { flex: 1; height: 2px; background: var(--danger); border-radius: 2px; }
.tl-now .tl-dot-now { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

/* ---------- Wetter ---------- */
.wx-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.wx-ic { font-size: 34px; line-height: 1; }
.wx-temp { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
.wx-main { flex: 1; }
.wx-desc { font-size: 13.5px; font-weight: 600; color: var(--text-2); margin-top: 1px; }
.wx-hi { font-size: 12.5px; color: var(--text-3); font-weight: 600; text-align: right; line-height: 1.5; }

/* ---------- Songwriting ---------- */
.song-card { cursor: pointer; }
.song-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.song-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song-status { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.song-status.s-idee { background: var(--card-2); color: var(--text-2); }
.song-status.s-arbeit { background: var(--lav); color: #131316; }
.song-status.s-fertig { background: var(--lime); color: #131316; }
.song-meta { font-size: 12.5px; color: var(--text-2); font-weight: 600; margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.song-snippet { font-size: 13.5px; color: var(--text-2); margin-top: 8px; line-height: 1.5; max-height: 42px; overflow: hidden; }
.sec-card { border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; background: var(--card); }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sec-type { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--lav); }
.sec-chords {
  width: 100%; border: none; background: var(--card-2); border-radius: 10px;
  padding: 9px 11px; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13.5px; color: var(--lime); outline: none; margin-bottom: 7px;
}
.sheet .sec-chords { background: #17171B; }
.sec-lyrics {
  width: 100%; border: none; background: transparent; font-family: inherit;
  font-size: 15px; line-height: 1.6; color: var(--text); outline: none;
  resize: none; min-height: 66px;
}
.memo-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.memo-row:last-child { border-bottom: none; }
.memo-play {
  width: 38px; height: 38px; min-width: 38px; border-radius: 50%; border: none;
  background: var(--lime); color: #131316; display: grid; place-items: center; font-size: 18px; cursor: pointer;
}
.memo-name { flex: 1; font-size: 13.5px; font-weight: 600; }
.memo-del { border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 16px; }
.rec-btn {
  width: 100%; border: 1.5px dashed var(--text-3); background: transparent; color: var(--text-2);
  border-radius: 14px; padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.rec-btn.rec { border-color: var(--danger); color: var(--danger); border-style: solid; animation: recPulse 1.2s ease infinite; }
@keyframes recPulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

.hey-name { font-size: 18px; }
.big-date { font-size: 86px; font-weight: 700; letter-spacing: -.055em; }
.big-day { font-size: 32px; font-weight: 500; }
.day-sub { font-weight: 500; }


</style>
</head>

<script>
/* ================= Storage (mit Fallback) ================= */
const mem = {};
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return k in mem ? mem[k] : d; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; }
  }
};

/* ================= State ================= */
const DEFAULT_LINKS = [
  { id: 'l1', label: 'WhatsApp', url: 'https://wa.me/', icon: '💬', color: '#25D366' },
  { id: 'l2', label: 'Mail', url: 'message://', icon: '✉️', color: '#3B82F6' },
  { id: 'l3', label: 'Maps', url: 'https://maps.apple.com/', icon: '🗺️', color: '#34C759' },
  { id: 'l4', label: 'Spotify', url: 'https://open.spotify.com/', icon: '🎵', color: '#1DB954' },
  { id: 'l5', label: 'Instagram', url: 'https://instagram.com/', icon: '📷', color: '#E1306C' },
  { id: 'l6', label: 'YouTube', url: 'https://youtube.com/', icon: '▶️', color: '#FF0000' },
  { id: 'l7', label: 'ChatGPT‑Alternative 😉', url: 'https://claude.ai/', icon: '✳️', color: '#D97706' },
];
let S = store.get('yanapp', null) || {
  name: 'Yan', theme: 'auto', accent: '#5B7CFA',
  tasks: [], events: [], links: DEFAULT_LINKS, notes: [], projects: [], habits: []
};
if (!S.projects) S.projects = [];
if (!S.habits) S.habits = [];
if (!S.songs) S.songs = [];
// Migration: entfernte Bereiche auf "privat" mappen
[S.tasks, S.events, S.notes, S.projects].forEach(list => (list || []).forEach(x => { if (x.cat === 'uni') x.cat = 'privat'; }));
function save() { S.lastChange = Date.now(); store.set('yanapp', S); if (typeof scheduleCloudPush === 'function') scheduleCloudPush(); }

/* ================= Lebensbereiche ================= */
const CATS = [
  { id: 'musik',    label: 'Musik',            icon: 'music_note', color: '#EC4899',
    kw: ['musik','song','songs','studio','beat','beats','mix','master','mastern','release','gig','auftritt','konzert','songtext','text schreiben','aufnahme','aufnehmen','musikvideo','spotify','label','probe','proben','bühne','buehne','instrumental','hook','feature','cover','single','album','ep'] },
  { id: 'arbeit',   label: 'Arbeit',           icon: 'work', color: '#0EA5E9',
    kw: ['arbeit','schicht','meeting','kunde','kunden','chef','büro','buero','job','bewerbung','projekt','kollege','kollegen','dienst'] },
  { id: 'sport',    label: 'Sport & Gesundheit', icon: 'exercise', color: '#2FA46A',
    kw: ['training','gym','fitness','laufen','joggen','sport','workout','arzt','ärztin','zahnarzt','apotheke','medikament','physio','impfung','spiel','turnier','schwimmen','fußball','fussball'] },
  { id: 'sozial',   label: 'Familie & Freunde', icon: 'favorite', color: '#E5484D',

/* ================= KALENDER ================= */
let calCursor = new Date(); calCursor.setDate(1);
let selDay = todayIso();
let calMode = 'monat';
function calDayCell(d, inMonth) {
  const dIso = iso(d);
  const evs = S.events.filter(e => e.date === dIso);
  const dotCols = [...evs.map(e => e.color), ...extOn(dIso).map(() => 'var(--lav)')];
  const cls = ['cal-day'];
  if (!inMonth) cls.push('other');
  if (dIso === todayIso()) cls.push('today');
  if (dotCols.length && inMonth) cls.push('has');
  if (dIso === selDay) cls.push('sel');
  const dots = dotCols.slice(0, 3).map(col => `<span class="dot" style="background:${dIso === selDay ? 'var(--pill-text)' : col}"></span>`).join('');
  return `<button class="${cls.join(' ')}" data-day="${dIso}">${d.getDate()}${dotCols.length ? `<span class="dots">${dots}</span>` : ''}</button>`;
}
function renderCal() {
  const cells = [];
  DOWS.forEach(d => cells.push(`<div class="cal-dow">${d}</div>`));
  if (calMode === 'woche') {
    const off = (calCursor.getDay() + 6) % 7;
    const mon = new Date(calCursor.getFullYear(), calCursor.getMonth(), calCursor.getDate() - off);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    $('#cal-month').textContent = mon.getDate() + '. – ' + sun.getDate() + '. ' + MONTHS[sun.getMonth()].slice(0, 3) + ' ' + sun.getFullYear();
    for (let i = 0; i < 7; i++) {
      cells.push(calDayCell(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i), true));
    }
    $('#cal-grid').classList.add('week');
  } else {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    $('#cal-month').textContent = MONTHS[m] + ' ' + y;
    const startOffset = (new Date(y, m, 1).getDay() + 6) % 7;
    const start = new Date(y, m, 1 - startOffset);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      cells.push(calDayCell(d, d.getMonth() === m));
    }
    $('#cal-grid').classList.remove('week');
  }
  $('#cal-grid').innerHTML = cells.join('');
  $('#sel-day-title').innerHTML = `${esc(relDay(selDay))} <span class="mini-link" id="add-ev-day">+ Termin</span>`;
  const dayEvs = [
    ...S.events.filter(e => e.date === selDay).map(e => ({ t: e.time || '', h: evRowHtml(e) })),
    ...extOn(selDay).map(e => ({ t: e.time || '', h: extRowHtml(e) }))
  ].sort((a, b) => a.t.localeCompare(b.t));
  $('#day-events').innerHTML = dayEvs.length ? dayEvs.map(x => x.h).join('')
    : '<div class="empty"><span class="e-icon msr"></span>Keine Termine an diesem Tag</div>';
}
function evRowHtml(e) {
  return `<div class="ev-row" data-ev="${e.id}">
    <div class="ev-bar" style="background:${e.color}"></div>
    <div class="ev-time">${e.time ? esc(e.time) : '—'}</div>
    <div class="ev-main">
      <div class="ev-title">${esc(e.title)} ${e.cat ? catTag(e.cat) : ''}</div>
      <div class="ev-notes">${e.date !== selDay || currentTab === 'heute' ? esc(relDay(e.date)) + (e.notes ? ' · ' + esc(e.notes) : '') : esc(e.notes || '')}</div>
    </div></div>`;
}
$('#cal-prev').addEventListener('click', () => { calMode === 'woche' ? calCursor.setDate(calCursor.getDate() - 7) : calCursor.setMonth(calCursor.getMonth() - 1); renderCal(); vibrate(); });
$('#cal-next').addEventListener('click', () => { calMode === 'woche' ? calCursor.setDate(calCursor.getDate() + 7) : calCursor.setMonth(calCursor.getMonth() + 1); renderCal(); vibrate(); });
$('#cal-mode').addEventListener('click', e => {

/* ================= CLOUD-SYNC (privates GitHub-Repo) ================= */
const SYNC_URL = 'https://api.github.com/repos/yanmushegera-web/yan-data/contents/backup.json';
const SYNC_SKIP = ['calToken', 'apiKey', 'syncToken', 'sabAdjust', 'lastSyncAt', 'lastChange'];
let syncTimer = null, syncSha = null;
function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s) { return decodeURIComponent(escape(atob(s))); }
function syncPayload() {
  const d = {};
  Object.keys(S).forEach(k => { if (!SYNC_SKIP.includes(k)) d[k] = S[k]; });
  return d;
}
function scheduleCloudPush() {
  if (!S.syncToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(cloudPush, 20000);
}
async function cloudPush() {
  if (!S.syncToken || !navigator.onLine) return;
  try {
    if (syncSha === null) {
      const g = await fetch(SYNC_URL, { headers: { authorization: 'Bearer ' + S.syncToken } });
      if (g.ok) syncSha = (await g.json()).sha;
      else if (g.status === 404) syncSha = '';
      else return;
    }
    const body = { message: 'sync', content: b64enc(JSON.stringify({ v: S.lastChange || Date.now(), data: syncPayload() })) };
    if (syncSha) body.sha = syncSha;
    const r = await fetch(SYNC_URL, { method: 'PUT', headers: { authorization: 'Bearer ' + S.syncToken, 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (r.ok) { syncSha = (await r.json()).content.sha; S.lastSyncAt = Date.now(); store.set('yanapp', S); }
    else if (r.status === 409) { syncSha = null; scheduleCloudPush(); }
  } catch (e) {}
}
async function cloudPull() {
  if (!S.syncToken || !navigator.onLine) return false;
  try {
    const r = await fetch(SYNC_URL, { headers: { authorization: 'Bearer ' + S.syncToken, accept: 'application/vnd.github+json' } });
    if (!r.ok) return false;
    const j = await r.json();
    syncSha = j.sha;
    const remote = JSON.parse(b64dec(j.content.replace(/\n/g, '')));
    if (remote && remote.v && remote.v > (S.lastChange || 0)) {
      Object.assign(S, remote.data);
      S.lastChange = remote.v; S.lastSyncAt = Date.now();
      store.set('yanapp', S);
      renderAll();
      return true;
    }
  } catch (e) {}
  return false;
}
window.addEventListener('online', () => scheduleCloudPush());
document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudPull(); });
setTimeout(cloudPull, 1500);

  try {
    const cached = store.get('yanapp_wx', null);
    if (cached && Date.now() - cached.ts < 30 * 60 * 1000) { renderWeather(cached.d); return; }
    let lat = 48.6256, lon = 9.3411;
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 3500, maximumAge: 3600000 }));
      lat = pos.coords.latitude; lon = pos.coords.longitude;
    } catch (e) {}
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=1`);
    if (!r.ok) return;
    const d = await r.json();
    store.set('yanapp_wx', { ts: Date.now(), d });
    renderWeather(d);
  } catch (e) {}
}

/* ================= MEMO-PLAYER ================= */
let MPA = null, mpTimer = null, mpOpenId = null;
function fmtT(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function stopMemo() {
  if (MPA) { MPA.pause(); MPA = null; }
  if (mpTimer) { clearInterval(mpTimer); mpTimer = null; }
  mpOpenId = null;
  document.querySelectorAll('.mp').forEach(el => el.remove());
}
function openMemoPlayer(m, rowEl) {
  if (mpOpenId === m.id) { stopMemo(); return; }
  stopMemo();
  mpOpenId = m.id;
  const panel = document.createElement('div');
  panel.className = 'mp';
  panel.innerHTML = `
    <input type="range" class="mp-seek" min="0" max="1000" value="0">
    <div class="mp-times"><span class="mp-cur">0:00</span><span class="mp-dur">…</span></div>
    <div class="mp-ctrl">
      <button class="mp-b" data-mp="back">−15</button>
      <button class="mp-b mp-main" data-mp="toggle"><span class="pause-bars"></span></button>
      <button class="mp-b" data-mp="fwd">+15</button>
    </div>`;
  rowEl.after(panel);
  const a = new Audio(URL.createObjectURL(m.blob));
  MPA = a;
  let dur = 0;
  const seek = panel.querySelector('.mp-seek'), cur = panel.querySelector('.mp-cur'), durEl = panel.querySelector('.mp-dur');
  const mainBtn = panel.querySelector('[data-mp="toggle"]');
  function setDur(d) { if (isFinite(d) && d > 0) { dur = d; durEl.textContent = fmtT(d); } }
  a.onloadedmetadata = () => {
    if (a.duration === Infinity) { a.currentTime = 1e7; a.ontimeupdate = () => { a.ontimeupdate = null; setDur(a.duration); a.currentTime = 0; a.play(); }; }
    else setDur(a.duration);
  };
  a.onended = () => { mainBtn.innerHTML = `<span class="msr">${ICON.play_arrow}</span>`; };
  mpTimer = setInterval(() => {
    if (!MPA) return;
    setDur(a.duration);
    cur.textContent = fmtT(a.currentTime);
    if (dur) seek.value = Math.round(a.currentTime / dur * 1000);
  }, 200);
  seek.addEventListener('input', () => { if (dur) a.currentTime = seek.value / 1000 * dur; });
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-mp]'); if (!b) return;
    if (b.dataset.mp === 'toggle') {
      if (a.paused) { a.play(); b.innerHTML = '<span class="pause-bars"></span>'; }
      else { a.pause(); b.innerHTML = `<span class="msr">${ICON.play_arrow}</span>`; }
    }
    if (b.dataset.mp === 'back') a.currentTime = Math.max(0, a.currentTime - 15);
    if (b.dataset.mp === 'fwd') a.currentTime = Math.min(dur || a.currentTime + 15, a.currentTime + 15);
    vibrate();
  });
  a.play().catch(() => {});
}

/* --- Sprachmemos (IndexedDB, Audio bleibt nur auf dem Gerät) --- */
function memoDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('yanapp-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('memos', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function memoAdd(m) { const db = await memoDb(); return new Promise((res, rej) => { const tx = db.transaction('memos', 'readwrite'); tx.objectStore('memos').put(m); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function memoDel(id) { const db = await memoDb(); return new Promise(res => { const tx = db.transaction('memos', 'readwrite'); tx.objectStore('memos').delete(id); tx.oncomplete = res; }); }
async function memoAll(songId) {
  const db = await memoDb();
  return new Promise(res => {
    const out = [];
    const c = db.transaction('memos').objectStore('memos').openCursor();
    c.onsuccess = e => { const cur = e.target.result; if (cur) { if (cur.value.songId === songId) out.push(cur.value); cur.continue(); } else res(out.sort((a, b) => b.ts - a.ts)); };
  });
}
let recMedia = null, recChunks = [], recStream = null, memoAudio = null;

/* --- PDF-Songsheet (ohne Fremdbibliothek, offline) --- */
function pdfText(s) {
  let out = '';
  for (const ch of String(s)) { const c = ch.codePointAt(0); out += (c >= 32 && c <= 255) ? ch : '?'; }
  return out.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}
function wrap(s, n) {
  const words = String(s).split(/\s+/); const lines = []; let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > n) { if (cur) lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function songPdf(song) {
  const pages = []; let items = []; let y = 792;
  const put = (txt, font, size, gap) => {
    if (y < 60) { pages.push(items); items = []; y = 792; }
    items.push({ txt, font, size, y });
    y -= size * (gap || 1.5);
  };
  put(song.title || 'Ohne Titel', 'F2', 20, 1.3);
  const meta = [song.key ? 'Tonart: ' + song.key : '', song.bpm ? song.bpm + ' BPM' : '', SONG_STATUS[song.status] || ''].filter(Boolean).join('   ·   ');
  if (meta) put(meta, 'F1', 10, 1.6);
  put('', 'F1', 8);
  (song.sections || []).forEach(sec => {
    put('[' + (sec.type || 'Part').toUpperCase() + ']', 'F2', 12, 1.5);
    if (sec.chords) wrap(sec.chords, 70).forEach(l => put(l, 'F3', 11, 1.4));
    (sec.lyrics || '').split('\n').forEach(line => wrap(line || ' ', 80).forEach(l => put(l, 'F1', 11, 1.45)));
    put('', 'F1', 7);
  });
  if (song.notes) {
    put('NOTIZEN', 'F2', 12, 1.5);
    song.notes.split('\n').forEach(line => wrap(line || ' ', 85).forEach(l => put(l, 'F1', 10, 1.45)));
  }
  pages.push(items);

  const objs = [];
  const fontObjIdx = 3 + pages.length * 2; // nach Katalog, Pages, Seiten+Streams
  const kids = pages.map((_, i) => (3 + i * 2) + ' 0 R').join(' ');
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push(`<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`);
  pages.forEach((pg, i) => {
    const streamIdx = 4 + i * 2;
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents ${streamIdx} 0 R /Resources << /Font << /F1 ${fontObjIdx} 0 R /F2 ${fontObjIdx + 1} 0 R /F3 ${fontObjIdx + 2} 0 R >> >> >>`);
    const content = pg.map(it => `BT /${it.font} ${it.size} Tf 50 ${Math.round(it.y)} Td (${pdfText(it.txt)}) Tj ET`).join('\n');
    objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  });
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');

  let pdf = '%PDF-1.4\n';
  const offsets = [];
  objs.forEach((o, i) => { offsets.push(pdf.length); pdf += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  const xref = pdf.length;
  pdf += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}
function downloadSongPdf(song) {
  const blob = new Blob([songPdf(song)], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (song.title || 'song').replace(/[^\wäöüÄÖÜß \-]/g, '').trim().replace(/\s+/g, '-') + '.pdf';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Songsheet exportiert 📄');
}

/* --- Song-Editor --- */
function sheetSong(s) {
  const isNew = !s;
  const tmp = isNew
    ? { id: uid(), title: '', status: 'idee', key: '', bpm: '', sections: [{ id: uid(), type: 'Verse', chords: '', lyrics: '' }], notes: '', createdAt: Date.now() }
    : s;
  openSheet(`
    <h3>${isNew ? 'Neuer Song' : 'Song bearbeiten'}</h3>
    <div class="f-label">Titel</div>
    <input class="f-input" id="sg-title" placeholder="Songtitel…" value="${esc(tmp.title)}">
    <div class="f-row" style="margin-top:10px">
      <div><div class="f-label" style="margin-top:0">Tonart</div><input class="f-input" id="sg-key" placeholder="z. B. Am" value="${esc(tmp.key || '')}"></div>
      <div><div class="f-label" style="margin-top:0">BPM</div><input class="f-input" id="sg-bpm" type="number" inputmode="numeric" placeholder="120" value="${esc(String(tmp.bpm || ''))}"></div>
    </div>
    <div class="f-label">Status</div>
    <div class="chip-row" id="sg-status">
      ${Object.entries(SONG_STATUS).map(([k, v]) => `<button class="chip ${tmp.status === k ? 'on' : ''}" data-st="${k}">${v}</button>`).join('')}
    </div>
    <div class="f-label">Song-Parts</div>
    <div id="sg-secs"></div>
    <div class="chip-row" id="sg-add-sec" style="margin-top:10px">
      ${SEC_TYPES.map(t => `<button class="chip" data-sec="${t}">＋ ${t}</button>`).join('')}
    </div>
    <div class="f-label">Sprachmemos</div>
    <div id="sg-memos"></div>
    <button class="rec-btn" id="sg-rec">${icon('mic')} Memo aufnehmen</button>
    <div class="f-label">Notizen zum Song</div>
    <textarea class="f-area" id="sg-notes" placeholder="Ideen, Referenzen, Produktions-Notizen…">${esc(tmp.notes || '')}</textarea>
    <button class="btn btn-primary" id="sg-save">${isNew ? 'Song anlegen' : 'Speichern'}</button>
    ${isNew ? '' : `<button class="btn" style="background:var(--lime);color:#131316;margin-top:8px" id="sg-pdf">${icon('picture_as_pdf')} Als PDF exportieren</button>`}
    ${isNew ? '' : '<button class="btn btn-ghost-danger" id="sg-del">Song löschen</button>'}
  `);
  let status = tmp.status;
  $('#sg-status').addEventListener('click', e => {
    const b = e.target.closest('[data-st]'); if (!b) return;
    status = b.dataset.st;
    document.querySelectorAll('#sg-status .chip').forEach(c => c.classList.toggle('on', c === b));
  });
  function renderSecs() {
    $('#sg-secs').innerHTML = tmp.sections.map((sec, i) => `
      <div class="sec-card">
        <div class="sec-head">
          <span class="sec-type">${esc(sec.type)}</span>
          <button class="ms-del" data-sdel="${i}">✕</button>
        </div>
        <input class="sec-chords" data-schords="${i}" placeholder="Akkorde: Am  F  C  G" value="${esc(sec.chords || '')}" autocapitalize="off">
        <textarea class="sec-lyrics" data-slyrics="${i}" placeholder="Lyrics…">${esc(sec.lyrics || '')}</textarea>
      </div>`).join('');
    $('#sg-secs').querySelectorAll('[data-sdel]').forEach(b => b.addEventListener('click', () => {
      syncSecs(); tmp.sections.splice(+b.dataset.sdel, 1); renderSecs();
    }));
  }
  function syncSecs() {
    $('#sg-secs').querySelectorAll('[data-schords]').forEach(el => { tmp.sections[+el.dataset.schords].chords = el.value; });
    $('#sg-secs').querySelectorAll('[data-slyrics]').forEach(el => { tmp.sections[+el.dataset.slyrics].lyrics = el.value; });
  }
  renderSecs();
  $('#sg-add-sec').addEventListener('click', e => {
    const b = e.target.closest('[data-sec]'); if (!b) return;
    syncSecs(); tmp.sections.push({ id: uid(), type: b.dataset.sec, chords: '', lyrics: '' }); renderSecs();
    vibrate();
  });
  // Memos
  const renderMemos = () => renderMemoList('#sg-memos', tmp.id);
  renderMemos();
  $('#sg-rec').addEventListener('click', async () => {
    const btn = $('#sg-rec');
    if (recMedia && recMedia.state === 'recording') {
      recMedia.stop(); return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recChunks = [];
      recMedia = new MediaRecorder(recStream);
      recMedia.ondataavailable = e => recChunks.push(e.data);
      recMedia.onstop = async () => {
        recStream.getTracks().forEach(t => t.stop());
        const blob = new Blob(recChunks, { type: recMedia.mimeType || 'audio/mp4' });
        await memoAdd({ id: uid(), songId: tmp.id, blob, ts: Date.now() });
        btn.classList.remove('rec');
        btn.innerHTML = icon('mic') + ' Memo aufnehmen';
        renderMemos(); toast('Memo gespeichert 🎙️'); vibrate();
      };
      recMedia.start();
      btn.classList.add('rec');
      btn.innerHTML = icon('stop') + ' Aufnahme läuft – tippen zum Stoppen';
      vibrate();
    } catch (e) { toast('Mikrofon nicht verfügbar – Berechtigung prüfen'); }
  });
  // Speichern / PDF / Löschen
  $('#sg-save').addEventListener('click', () => {
    syncSecs();
    tmp.title = $('#sg-title').value.trim() || 'Ohne Titel';
    tmp.key = $('#sg-key').value.trim();
    tmp.bpm = $('#sg-bpm').value.trim();
    tmp.status = status;
    tmp.notes = $('#sg-notes').value.trim();
    tmp.updatedAt = Date.now();
    if (isNew) { S.songs.push(tmp); toast('Song angelegt 🎵'); }
    else toast('Gespeichert');
    save(); closeSheet(); renderMehr();
  });
  if (!isNew) {
    $('#sg-pdf').addEventListener('click', () => {
      syncSecs();
      tmp.title = $('#sg-title').value.trim() || 'Ohne Titel';
      tmp.key = $('#sg-key').value.trim(); tmp.bpm = $('#sg-bpm').value.trim();
      tmp.notes = $('#sg-notes').value.trim();
      downloadSongPdf(tmp);
    });
    $('#sg-del').addEventListener('click', () => {
      S.songs = S.songs.filter(x => x.id !== tmp.id);
      save(); closeSheet(); renderMehr(); toast('Song gelöscht');
    });
  }
}

  bindCatRow('st-cat', v => cat = v);
  $('#st-prio').addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    prio = b.dataset.p;
    document.querySelectorAll('#st-prio .chip').forEach(c => c.classList.toggle('on', c === b));

  $('#st-due-chips').addEventListener('click', e => {

  });
}

/* ================= Sheets: Notiz ================= */
function sheetNote(n) {
  const isNew = !n;
  openSheet(`
    <h3>${isNew ? 'Neue Notiz' : 'Notiz'}</h3>
    <textarea class="f-area" id="sn-text" placeholder="Schreib etwas auf…" style="min-height:140px">${n ? esc(n.text) : ''}</textarea>
    <div class="f-label">Lebensbereich</div>
    ${catChipsHtml('sn-cat', n ? n.cat : null)}
    <div class="f-label">Verknüpfungen</div>
    <div id="sn-links"></div>
    <div class="chip-row">
      <button class="chip" id="sn-link-task">＋ Aufgabe</button>
      <button class="chip" id="sn-link-ev">＋ Termin</button>
    </div>
    <div id="sn-pick" style="display:none;max-height:220px;overflow-y:auto;margin-top:8px"></div>
    <button class="btn btn-primary" id="sn-save">Speichern</button>
    ${isNew ? '' : '<button class="btn" style="background:var(--accent-soft);color:var(--accent);margin-top:8px" id="sn-analyze"><span class="msr"></span> Analysieren → Aufgabe / Termin</button>'}
    ${isNew ? '' : '<button class="btn btn-ghost-danger" id="sn-del">Löschen</button>'}
  `);
  let cat = n ? n.cat || null : null;
  bindCatRow('sn-cat', v => cat = v);
  const links = n && n.links ? n.links.slice() : [];
  function renderNoteLinks() {
    $('#sn-links').innerHTML = links.map((l, i) => {
      const item = l.t === 'task' ? S.tasks.find(x => x.id === l.id) : S.events.find(x => x.id === l.id);
      if (!item) return '';
      return `<span class="link-chip">${l.t === 'task' ? icon('task_alt') : icon('event')} ${esc(item.title.slice(0, 26))}<button data-lrm="${i}">✕</button></span>`;
    }).join('') || '<div style="font-size:13px;color:var(--text-3)">Keine Verknüpfungen</div>';
    $('#sn-links').querySelectorAll('[data-lrm]').forEach(b => b.addEventListener('click', () => {
      links.splice(+b.dataset.lrm, 1); renderNoteLinks();
    }));
  }
  renderNoteLinks();
  function showPicker(type) {
    const pool = type === 'task'
      ? S.tasks.filter(t => !t.done).slice(0, 15)
      : S.events.filter(e => e.date >= iso(new Date(Date.now() - 7 * 864e5))).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 15);

/* ================= Ziele & Projekte ================= */
function projProgress(p) {
  if (p.goalVal && p.goalVal > 0) return Math.min(100, Math.round((p.currentVal || 0) / p.goalVal * 100));
  if (p.milestones && p.milestones.length) return Math.round(p.milestones.filter(m => m.done).length / p.milestones.length * 100);
  return 0;
}
const projOpen = new Set();
function projRowHtml(p, compact) {
  const isOpen = projOpen.has(p.id);

  const nextMs = (p.milestones || []).find(m => !m.done);
