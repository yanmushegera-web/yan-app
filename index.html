  return `<div class="proj-row" ${compact ? `data-proj-go="${p.id}"` : `data-proj="${p.id}"`}>
    <div class="proj-top">
      <div class="proj-title">${c ? icon(c.icon) + ' ' : ''}${esc(p.title)}</div>
      <div class="proj-pct" ${pct >= 100 ? 'style="color:var(--ok)"' : ''}>${pct >= 100 ? '✓ Erreicht' : pct + '%'}</div>
      ${compact ? '' : `<span class="proj-chev ${isOpen ? 'open' : ''} msr">${ICON.chevron_right}</span>`}
    </div>
    <div class="proj-bar"><div style="width:${pct}%;${pct >= 100 ? 'background:var(--ok)' : (c ? 'background:' + c.color : '')}"></div></div>
    <div class="proj-meta">
      ${p.cat ? catTag(p.cat) : ''}
      ${p.deadline ? `<span>bis ${esc(relDay(p.deadline))}</span>` : ''}
      ${(compact || !isOpen) && nextMs ? `<span>· Nächster Schritt: ${esc(nextMs.title)}</span>` : ''}
      ${(compact || !isOpen) && p.goalVal ? `<span><b>${p.currentVal || 0}</b> / ${p.goalVal} ${esc(p.unit || '')}</span>` : ''}
    </div>
    ${!compact && isOpen && (p.milestones || []).length ? `<div class="ms-list">${p.milestones.map(m => `
      <div class="ms-row ${m.done ? 'done' : ''}">
        <div class="ms-check" data-msx="${p.id}:${m.id}">✓</div>
        <span>${esc(m.title)}</span>
      </div>`).join('')}</div>` : ''}
    ${!compact && isOpen && p.goalVal ? `<div class="num-step">
      <button data-numstep="${p.id}:-1">−</button>

  </div>`;
}
document.addEventListener('click', e => {
  const ms = e.target.closest('[data-msx]');
  if (ms) {
    e.stopPropagation();
    const [pid, mid] = ms.dataset.msx.split(':');
    const p = S.projects.find(x => x.id === pid); if (!p) return;
    const m = p.milestones.find(x => x.id === mid); if (!m) return;
    m.done = !m.done;
    if (m.done) { const r = ms.getBoundingClientRect(); confetti(r.left + 15, r.top + 15); toast(projProgress(p) >= 100 ? '🏆 Ziel erreicht!' : 'Meilenstein geschafft ✓'); }
    save(); vibrate(); renderAll();

    const p = S.projects.find(x => x.id === pid); if (!p) return;
    p.currentVal = Math.max(0, (p.currentVal || 0) + Number(dir) * (p.step || 1));
    if (projProgress(p) >= 100) { const r = ns.getBoundingClientRect(); confetti(r.left + 20, r.top + 20, 24); toast('🏆 Ziel erreicht!'); }

    ? active.slice().sort((a, b) => (a.deadline || '9999') < (b.deadline || '9999') ? -1 : 1).map(p => projRowHtml(p)).join('')

/* ================= Gewohnheiten ================= */
function weekDays() {
  const d = new Date(); const off = (d.getDay() + 6) % 7;
  const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - off);
  return Array.from({ length: 7 }, (_, i) => iso(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i)));
}
function habitStreak(h) {
  let n = 0; const d = new Date();
  if (!h.days[iso(d)]) d.setDate(d.getDate() - 1); // heute noch offen? Streak zählt bis gestern
  while (h.days[iso(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function habitRowHtml(h) {
  const t = todayIso();
  const streak = habitStreak(h);
  return `<div class="habit-row">
    <div class="habit-top">
      <span style="font-size:17px">${h.icon}</span>
      <span class="habit-name" data-habit-edit="${h.id}">${esc(h.title)}</span>
      ${streak > 0 ? `<span class="streak">${icon('local_fire_department')} ${streak}</span>` : ''}
    </div>
    <div class="habit-week">
      ${weekDays().map((d, i) => `<div class="hw-day">
        <span class="hw-label">${DOWS[i]}</span>
        <button class="hw-dot ${h.days[d] ? 'done' : ''} ${d === t ? 'today' : ''} ${d > t ? 'future' : ''}" ${d === t ? `data-hw="${h.id}"` : 'disabled'}>✓</button>
      </div>`).join('')}
    </div>
  </div>`;
}
function toggleHabitToday(id, srcEl) {
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const t = todayIso();
  if (h.days[t]) delete h.days[t];
  else {
    h.days[t] = true;
    const st = habitStreak(h);
    if (srcEl) {
      const r = srcEl.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2, st > 0 && st % 7 === 0 ? 24 : 10);
    }
    toast(st > 0 && st % 7 === 0 ? `🏆 ${st} Tage – eine ganze Woche geschafft!` : st > 1 ? `🔥 ${st} Tage am Stück – stark!` : '✓ Abgehakt – guter Start!');
  }
  save(); vibrate(); renderAll();
}
document.addEventListener('click', e => {
  const hw = e.target.closest('[data-hw]');
  if (hw) { toggleHabitToday(hw.dataset.hw, hw); return; }
  const hh = e.target.closest('[data-hh]');
  if (hh) { toggleHabitToday(hh.dataset.hh, hh); return; }
  const he = e.target.closest('[data-habit-edit]');
  if (he) { sheetHabit(S.habits.find(x => x.id === he.dataset.habitEdit)); return; }
  const pe = e.target.closest('[data-projedit]');
  if (pe) { sheetProject(S.projects.find(x => x.id === pe.dataset.projedit)); return; }
  const pg = e.target.closest('[data-proj-go]');
  if (pg) {
    projOpen.add(pg.dataset.projGo);
    switchTab('ziele'); renderZiele(); vibrate();
    setTimeout(() => { const el = document.querySelector(`#view-ziele [data-proj="${pg.dataset.projGo}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
    return;
  }
  const pr = e.target.closest('[data-proj]');
  if (pr) {
    const id = pr.dataset.proj;
    projOpen.has(id) ? projOpen.delete(id) : projOpen.add(id);
    renderZiele(); vibrate();
  }
  if (e.target.id === 'add-project' || e.target.closest('#add-project')) sheetProject(null);
  if (e.target.id === 'add-habit' || e.target.closest('#add-habit')) sheetHabit(null);
});

/* ================= Sprach-Eingabe: Analyse ================= */
const WD = { montag:1, dienstag:2, mittwoch:3, donnerstag:4, freitag:5, samstag:6, sonnabend:6, sonntag:0 };
const MN = { januar:1, februar:2, 'märz':3, maerz:3, april:4, mai:5, juni:6, juli:7, august:8, september:9, oktober:10, november:11, dezember:12 };
const TASK_KW = ['muss','müssen','musst','soll','sollte','erledigen','kaufen','einkaufen','anrufen','abgeben','besorgen','waschen','putzen','aufräumen','bezahlen','überweisen','buchen','vorbereiten','lernen','schreiben','nicht vergessen','denk daran','denken','to do','todo','aufgabe','erinnere','kündigen','beantragen','ausfüllen','abholen','zurückgeben','reparieren','organisieren','packen','drucken','ausdrucken'];
const EVENT_KW = ['termin','treffen','treffe','verabredet','verabredung','meeting','feier','party','geburtstag','besuch','besuche','training','spiel','vorlesung','seminar','klausur','prüfung','arzt','zahnarzt','essen','kino','konzert','date','unterricht','kurs','schicht','frisör','friseur'];

function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
function nextWeekday(dow) {
  const d = new Date(); let diff = (dow - d.getDay() + 7) % 7;
  if (diff === 0) diff = 7;
  d.setDate(d.getDate() + diff); return iso(d);
}
function parseWhen(text) {
  let s = ' ' + text + ' ', date = null, time = null;
  const cut = re => { const m = s.match(re); if (m) s = s.replace(re, ' '); return m; };
  // Uhrzeit
  let m = cut(/\b(?:um|ab|gegen)\s+(\d{1,2})[:.](\d{2})(?:\s*uhr)?\b/i) || cut(/\b(?:um|ab|gegen)\s+(\d{1,2})\s*uhr\s*(\d{2})?\b/i)
       || cut(/\b(\d{1,2})[:.](\d{2})\s*uhr\b/i) || cut(/\b(\d{1,2})\s*uhr\b/i);
  if (m) { const h = +m[1], mi = m[2] ? +m[2] : 0; if (h < 24 && mi < 60) time = pad(h) + ':' + pad(mi); }
  // Relative Tage
  if (cut(/(?:^|[\s,])über\s?morgen\b/i)) date = addDays(2);
  else if (cut(/\bmorgen\s+(früh|vormittag|mittag|nachmittag|abend)\b/i) || cut(/\bmorgen\b/i)) date = date || addDays(1);
  else if (cut(/\bheute\s+(früh|vormittag|mittag|nachmittag|abend)\b/i) || cut(/\bheute\b/i)) date = date || todayIso();
  // Wochentag
  m = cut(new RegExp('\\b(?:am|n[äa]chsten|n[äa]chste|kommenden|diesen)?\\s*(' + Object.keys(WD).join('|') + ')\\b', 'i'));
  if (m && !date) date = nextWeekday(WD[m[1].toLowerCase()]);
  // Explizites Datum: am 15.8. / am 15. August
  m = cut(/\b(?:am|zum)?\s*(\d{1,2})\.\s?(\d{1,2})\.?(?:(\d{4})\b)?/);
  if (m && !date) {
    const now = new Date(); let y = m[3] ? +m[3] : now.getFullYear();
    let d = new Date(y, +m[2] - 1, +m[1]);
    if (!m[3] && d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d.setFullYear(y + 1);
    date = iso(d);
  }
  m = cut(new RegExp('\\b(?:am|zum)?\\s*(\\d{1,2})\\.?\\s+(' + Object.keys(MN).join('|') + ')\\b', 'i'));
  if (m && !date) {
    const now = new Date(); let d = new Date(now.getFullYear(), MN[m[2].toLowerCase()] - 1, +m[1]);
    if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d.setFullYear(d.getFullYear() + 1);
    date = iso(d);
  }
  // in X Tagen / Wochen / nächste Woche
  m = cut(/\bin\s+(\d+|einer|einem|zwei|drei|vier)\s+(tag(?:en)?|woche(?:n)?)\b/i);
  if (m && !date) {
    const map = { einer:1, einem:1, zwei:2, drei:3, vier:4 };
    const n = map[m[1].toLowerCase()] || +m[1];
    date = addDays(/woche/i.test(m[2]) ? n * 7 : n);
  }
  if (cut(/\bn[äa]chste\s+woche\b/i) && !date) date = addDays(7);
  return { date, time, cleaned: s.replace(/\s{2,}/g, ' ').trim() };
}
function detectCat(text) {
  const lower = text.toLowerCase();
  let best = null, bestN = 0;
  CATS.forEach(c => {
    const n = c.kw.reduce((acc, k) => acc + (lower.includes(k) ? 1 : 0), 0);
    if (n > bestN) { bestN = n; best = c.id; }
  });
  return best;
}
function cleanTitle(s) {
  let t = ' ' + s + ' ';
  const fillers = [
    /\b(?:ich|wir)\s+(?:muss|müssen|soll|sollte|will|möchte|habe?|treffe|gehe?|bin)\s+(?:noch|unbedingt|dann|auch|mich|mir)?\s*/gi,
    /\b(?:bitte|noch|unbedingt|dringend|daran denken|denk daran|nicht vergessen|erinnere mich(?: daran)?|todo|to do|aufgabe|notiz|einen?|eine|zum|zur|beim?|mit dem|dass|danach|dann)\s+/gi,
    /^\s*(?:zu|an|,|und|dann|die|der|das|den|dem)\s+/gi
  ];
  fillers.forEach(re => { t = t.replace(re, ' '); });
  t = t.replace(/\s{2,}/g, ' ').replace(/^[\s,.\-–]+|[\s,.\-–]+$/g, '').trim();
  if (!t) t = s.trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function parseCapture(text) {
  // Punkt trennt Sätze – aber nicht innerhalb von Datumsangaben wie "15.9."
  const segs = text.split(/[!?;\n]+|(?<!\d)\.(?!\d)|\s+und\s+dann\s+|\s+danach\s+|\s+außerdem\s+/i).map(x => x.trim()).filter(x => x.length > 2);
  return segs.map(seg => {
    const lower = seg.toLowerCase();
    const { date, time, cleaned } = parseWhen(seg);
    const hasTask = TASK_KW.some(k => lower.includes(k));
    const hasEvent = EVENT_KW.some(k => lower.includes(k));
    let type;
    if (hasEvent && (date || time)) type = 'event';
    else if (hasTask) type = 'task';
    else if (date || time) type = 'event';
    else type = 'note';
    const item = {
      type,
      title: cleanTitle(cleaned),
      date: date || (type === 'event' ? todayIso() : null),
      time: time,
      cat: detectCat(seg),
      aiNotes: '',
      raw: seg
    };
    // Aufzählungen (z. B. Einkaufsliste) als Notiz an die Aufgabe hängen
    const lm = item.title.match(/^(.*?(?:einkaufen|einkäufe|kaufen|besorgen|mitbringen|packen|holen))[:,]\s*(.+)$/i);
    if (item.type === 'task' && lm && (/,/.test(lm[2]) || /\bund\b/i.test(lm[2]))) {
      item.title = cleanTitle(lm[1]);
      item.aiNotes = lm[2].split(/\s*,\s*|\s+und\s+/i)
        .map(s => s.trim()).filter(Boolean)
        .map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('\n');
    }
    return item;
  });
}

/* ================= KI-Analyse (Claude API) ================= */
const AI_MODELS = ['claude-haiku-4-5', 'claude-3-5-haiku-20241022'];
function aiSystemPrompt() {
  const now = new Date();
  const wd = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][now.getDay()];
  return `Du bist der Assistent in Yans persönlicher Organisations-App. Heute ist ${wd}, der ${todayIso()}.
Analysiere Yans Eingabe (gesprochen oder getippt) und wandle sie in konkrete Einträge um.

Lebensbereiche (cat): ${CATS.map(c => c.id + ' = ' + c.label).join(', ')}.

Antworte AUSSCHLIESSLICH mit validem JSON in diesem Format:
{"items":[
 {"type":"task","title":"…","due":"YYYY-MM-DD oder null","prio":"hoch|mittel|niedrig","cat":"…","notes":"kurz, optional"},
 {"type":"event","title":"…","date":"YYYY-MM-DD","time":"HH:MM oder null","cat":"…","notes":"optional"},
 {"type":"note","title":"…ausformulierter, strukturierter Notiztext…","cat":"…"},
 {"type":"project","title":"…","cat":"…","deadline":"YYYY-MM-DD oder null","milestones":["Schritt 1","Schritt 2","…"]}
]}

Regeln:
- Benenne Aufgaben prägnant und aktiv (Verb + Objekt), fasse den Sinn zusammen statt wörtlich zu übernehmen.
- WICHTIG: Genannte Details, Produkte und Aufzählungen gehören ins Feld "notes" des Eintrags – als Liste, ein Punkt pro Zeile (mit \\n getrennt). Beispiel: "Ich muss einkaufen, Milch, Eier und Brot" → task "Einkaufen" mit notes "Milch\\nEier\\nBrot". Genauso: Orte, Personen, Hinweise ("bring die Unterlagen mit") → notes des passenden Eintrags.
- Erkenne größere Vorhaben und lege sie als "project" mit 3–7 konkreten, logischen Zwischenschritten an.
- Ideen und Gedanken ohne Handlungsbedarf werden zu "note" – ausformuliert und geordnet, nicht wortwörtlich.
- Relative Zeitangaben (morgen, nächsten Freitag …) rechnest du in echte Daten um.
- Ordne jedem Eintrag den passenden Lebensbereich zu. Bei Unsicherheit: privat.
- Mehrere Anliegen in einer Eingabe ergeben mehrere Einträge.`;
}
async function aiAnalyze(text) {
  let lastErr = null;
  for (const model of AI_MODELS) {
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': S.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model, max_tokens: 1500,
          system: aiSystemPrompt(),
          messages: [{ role: 'user', content: text }]
        })
      });
      if (res.status === 404) { lastErr = new Error('model'); continue; }
      if (!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();
      const raw = (data.content || []).map(c => c.text || '').join('');
      const jsonStr = raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1);
      const parsed = JSON.parse(jsonStr);
      return (parsed.items || []).map(it => ({
        type: ['task','event','note','project'].includes(it.type) ? it.type : 'note',
        title: (it.title || '').trim() || text.slice(0, 60),
        date: it.type === 'event' ? (it.date || todayIso()) : (it.due || it.deadline || null),
        time: it.time || null,
        cat: catById(it.cat) ? it.cat : null,
        prio: ['hoch','mittel','niedrig'].includes(it.prio) ? it.prio : 'mittel',
        aiNotes: (it.notes || '').trim(),
        milestones: Array.isArray(it.milestones) ? it.milestones.filter(m => typeof m === 'string' && m.trim()) : [],
        raw: text
      }));
    } catch (e) { lastErr = e; if (String(e.message) !== 'model') break; }
  }
  throw lastErr || new Error('KI nicht erreichbar');
}

  if (recActive) { stopRec(); return; }

    rec = new SR();

      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) capFinal += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      const live = $('#cap-live'); if (live) live.textContent = (capFinal + interim).trim();
    };
    rec.onend = () => { recActive = false; const b = $('#cap-mic'); if (b) b.classList.remove('rec'); const st = $('#cap-status'); if (st) st.textContent = 'Aufnahme beendet – tippe auf Analysieren'; };

}

    syncProps(); capProps.splice(+b.dataset.pdel, 1); renderProps();

  $('#cap-commit').innerHTML = `<button class="btn btn-primary" id="cap-save">${capProps.length === 1 ? 'Eintrag übernehmen' : capProps.length + ' Einträge übernehmen'}</button>`;
  $('#cap-save').addEventListener('click', () => {
    syncProps();
    let nE = 0, nT = 0, nN = 0, nP = 0;
    capProps.forEach(p => {
      const title = (p.title || '').trim() || p.raw;
      if (p.type === 'event') { S.events.push({ id: uid(), title, date: p.date || todayIso(), time: p.time || null, color: (catById(p.cat) || {}).color || S.accent, cat: p.cat, notes: p.aiNotes || '' }); nE++; }
      else if (p.type === 'task') { S.tasks.unshift({ id: uid(), title, due: p.date || null, dueTime: p.time || null, prio: p.prio || 'mittel', cat: p.cat, notes: p.aiNotes || '', done: false, doneAt: null, notified: false }); nT++; }
      else if (p.type === 'project') { S.projects.push({ id: uid(), title, cat: p.cat, deadline: p.date || null, goalVal: null, currentVal: null, unit: '', milestones: (p.milestones || []).map(m => ({ id: uid(), title: m, done: false })), archived: false, createdAt: Date.now() }); nP++; }
      else { S.notes.push({ id: uid(), text: title, cat: p.cat, updatedAt: Date.now() }); nN++; }
    });
    save(); closeSheet(); renderAll();
    const parts = [];
    if (nE) parts.push(nE + (nE === 1 ? ' Termin' : ' Termine'));
    if (nT) parts.push(nT + (nT === 1 ? ' Aufgabe' : ' Aufgaben'));
    if (nP) parts.push(nP + (nP === 1 ? ' Ziel' : ' Ziele'));
    if (nN) parts.push(nN + (nN === 1 ? ' Notiz' : ' Notizen'));
    toast(parts.join(', ') + ' erstellt ✓');
  });
}
$('#fab-mic').addEventListener('click', () => { vibrate(); openCapture(); });

/* ================= FAB ================= */
$('#fab').addEventListener('click', () => {
  vibrate();
  if (currentTab === 'kalender') sheetEvent(null, selDay);
  else if (currentTab === 'mehr') { mehrMode === 'musik' ? sheetSong(null) : sheetNote(null); }
  else if (currentTab === 'ziele') sheetChooseGoal();
  else sheetTask(null);
});

/* ================= Externe Kalender (Google & Co. via Sync-Repo) ================= */
const CAL_DATA_URL = 'https://api.github.com/repos/yanmushegera-web/yan-data/contents/events.json';
const SRC_LABEL = { google: 'Google', outlook: 'Arbeit' };
let EXT = store.get('yanapp_ext', []);
EXT.forEach((e, i) => { if (!e.id) e.id = 'x' + i; });
let extLastSync = 0;
async function syncExternal(force) {
  if (!S.calToken) return;
  if (!force && Date.now() - extLastSync < 5 * 60 * 1000) return;
  try {
    const res = await fetch(CAL_DATA_URL, {
      headers: { authorization: 'Bearer ' + S.calToken, accept: 'application/vnd.github.raw+json' },
      cache: 'no-store'
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (Array.isArray(data)) {
      EXT = data; EXT.forEach((e, i) => { if (!e.id) e.id = 'x' + i; }); extLastSync = Date.now();
      store.set('yanapp_ext', EXT);
      renderAll();
    }
  } catch (e) { /* offline oder Token-Problem – Cache bleibt */ }
}
function extOn(dateIso) { return EXT.filter(e => e.date === dateIso); }
function extRowHtml(e) {
  return `<div class="ev-row ext">
    <div class="ev-bar" style="background:var(--lav)"></div>
    <div class="ev-time">${e.time ? esc(e.time) : '—'}</div>
    <div class="ev-main">
      <div class="ev-title">${esc(e.title)} <span class="cat-tag" style="background:var(--lav);color:#131316">${icon('calendar_month')} ${esc(SRC_LABEL[e.src] || 'Kalender')}</span></div>
      ${e.loc ? `<div class="ev-notes">${esc(e.loc)}</div>` : ''}
    </div></div>`;
}
setInterval(() => syncExternal(false), 10 * 60 * 1000);

/* ================= Erinnerungen & App-Badge ================= */
function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: './icon-192.png' }); } catch (e) {}
}
function checkReminders() {
  const t = todayIso(), hm = nowHM();
  let changed = false;
  S.tasks.forEach(x => {
    if (!x.done && !x.notified && x.due && x.dueTime && (x.due < t || (x.due === t && x.dueTime <= hm))) {
      notify('⏰ Aufgabe fällig', x.title);
      toast('⏰ Fällig: ' + x.title);
      x.notified = true; changed = true;
    }
  });
  S.events.forEach(ev => {
    if (!ev.notified && ev.date === t && ev.time) {
      const [h, m] = ev.time.split(':').map(Number);
      const soon = new Date(); soon.setHours(h, m - 30, 0, 0);
      if (new Date() >= soon) {
        notify('📅 Gleich: ' + ev.title, 'Um ' + ev.time + (ev.notes ? ' · ' + ev.notes : ''));
        ev.notified = true; changed = true;
      }
    }
  });
  if (changed) save();
}
function updateBadge() {
  if (!('setAppBadge' in navigator)) return;
  const n = S.tasks.filter(x => !x.done && x.due && x.due <= todayIso()).length;
  try { n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) {}
}
setInterval(checkReminders, 30000);

/* ================= Konfetti (Belohnungsmomente) ================= */
const CONFETTI_COLORS = ['#D9F24F', '#BCA7FA', '#7C5CF6', '#EC4899', '#2FA46A', '#F4F3EC'];
function confetti(x, y, n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < (n || 14); i++) {
    const p = document.createElement('div');
    p.className = 'confetti-p';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    if (i % 3 === 0) p.style.borderRadius = '50%';
    document.body.appendChild(p);
    const ang = Math.PI * 2 * (i / (n || 14)) + (Math.PI / 8) * ((i % 5) / 5);
    const dist = 46 + (i % 4) * 22;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 36;
    p.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 70}px) scale(.5) rotate(${180 + i * 40}deg)`, opacity: 0 }
    ], { duration: 650 + (i % 4) * 90, easing: 'cubic-bezier(0,0,.2,1)' }).onfinish = () => p.remove();
  }
}

/* ================= Zahlen-Countup ================= */
function countUp(el, target) {
  const prev = parseInt(el.dataset.v || '0', 10);
  el.dataset.v = target;
  if (prev === target || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = target; return; }
  const t0 = performance.now(), dur = 380;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(prev + (target - prev) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ================= Swipe-zum-Löschen (Aufgaben) ================= */
let sw = null;
document.addEventListener('pointerdown', e => {
  const wrapEl = e.target.closest('.task-swipe');
  const row = wrapEl ? wrapEl.querySelector(':scope > :not(.task-del-btn)') : null;
  if (!row) return;
  sw = { row, wrap: row.parentElement, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
}, { passive: true });
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.active) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) { sw.active = true; sw.wrap.classList.add('dragging'); }
    else if (Math.abs(dy) > 12) { sw = null; return; }
    else return;
  }
  sw.dx = Math.min(0, dx);
  sw.row.style.transform = `translateX(${Math.max(sw.dx, -110)}px)`;
}, { passive: true });
document.addEventListener('pointerup', () => {
  if (!sw) return;
  const { row, wrap, dx, active } = sw;
  wrap.classList.remove('dragging');
  if (active) {
    suppressClickUntil = Date.now() + 350;
    const reveal = dx < -55;
    row.style.transform = reveal ? 'translateX(-88px)' : '';
    wrap.classList.toggle('revealed', reveal);
  }
  sw = null;
}, { passive: true });
let suppressClickUntil = 0;
document.addEventListener('click', e => {
  const gdel = e.target.closest('[data-gdel]');
  if (gdel) {
    const [kind, id] = gdel.dataset.gdel.split(':');
    const wrap = gdel.closest('.task-swipe');
    wrap.style.maxHeight = wrap.offsetHeight + 'px';
    requestAnimationFrame(() => { wrap.classList.add('removing'); });
    setTimeout(() => {
      if (kind === 'note') S.notes = S.notes.filter(x => x.id !== id);
      if (kind === 'song') S.songs = S.songs.filter(x => x.id !== id);
      save(); renderAll(); toast('Gelöscht'); 
    }, 260);
    vibrate();
    return;
  }
  const del = e.target.closest('.task-del-btn');
  if (del) {
    const wrap = del.closest('.task-swipe');
    wrap.style.maxHeight = wrap.offsetHeight + 'px';
    requestAnimationFrame(() => wrap.classList.add('removing'));
    vibrate();
    setTimeout(() => {
      S.tasks = S.tasks.filter(x => x.id !== del.dataset.tdel);
      save(); renderAll(); toast('Aufgabe gelöscht');
    }, 240);
    return;
  }
  // Offene Swipes schließen beim Tippen woanders
  document.querySelectorAll('.task-swipe .task-row[style]').forEach(r => {
    if (!e.target.closest('.task-swipe')) r.style.transform = '';
  });
}, true);

/* ================= Sheet: nach unten wischen zum Schließen ================= */
(function () {
  const sheet = $('#sheet');
  let drag = null;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 2) return;
    drag = { y0: e.touches[0].clientY, dy: 0, engaged: false };
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!drag) return;
    drag.dy = e.touches[0].clientY - drag.y0;
    if (drag.dy > 6 && sheet.scrollTop <= 0) {
      drag.engaged = true;
      e.preventDefault();
      sheet.style.transition = 'none';
      sheet.style.transform = `translateY(${drag.dy}px)`;
    }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (!drag) return;
    sheet.style.transition = '';
    if (drag.engaged && drag.dy > 110) { sheet.style.transform = ''; closeSheet(); }
    else sheet.style.transform = '';
    drag = null;
  });
  // Griff zusätzlich per Maus/Pointer ziehbar (Desktop & Tests)
  const grip = document.querySelector('.grip');
  let gdrag = null;
  grip.addEventListener('pointerdown', e => { gdrag = { y0: e.clientY }; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove', e => {
    if (!gdrag) return;
    const dy = Math.max(0, e.clientY - gdrag.y0);
    gdrag.dy = dy;
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${dy}px)`;
  });
  grip.addEventListener('pointerup', () => {
    if (!gdrag) return;
    sheet.style.transition = '';
    if ((gdrag.dy || 0) > 110) { sheet.style.transform = ''; closeSheet(); }
    else sheet.style.transform = '';
    gdrag = null;
  });
})();

/* ================= Render all ================= */
function renderAll() {
  renderHome(); renderCal(); renderTasks(); renderNotes(); renderMehr(); renderZiele(); updateBadge();
}
/* Echte sichtbare Höhe messen (iOS-Toolbar/Viewport-Bug) */
let lastVH = 0;
function fixBarGap() {
  const standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!standalone) return;
  if (!document.body) return;
  // env()-Werte messen — auf fehlerhaften Geräten liefern sie 0
  const pTop = document.createElement('div');
  pTop.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);left:0;width:1px;height:1px;visibility:hidden;pointer-events:none';
  const pBot = document.createElement('div');
  pBot.style.cssText = 'position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;width:1px;height:1px;visibility:hidden;pointer-events:none';
  document.body.appendChild(pTop); document.body.appendChild(pBot);
  const satVal = pTop.getBoundingClientRect().top;
  const sabVal = window.innerHeight - pBot.getBoundingClientRect().bottom;
  pTop.remove(); pBot.remove();
  // Gerät meldet 0, obwohl Kamera-Aussparung/Home-Balken existieren → selbst setzen
  if (satVal < 20) document.documentElement.style.setProperty('--sat', '56px');
  if (typeof S !== 'undefined' && S.sabAdjust != null) {
    document.documentElement.style.setProperty('--sab', S.sabAdjust + 'px');
  } else if (sabVal < 10) {
    document.documentElement.style.setProperty('--sab', '50px');
  }
}
window.addEventListener('resize', fixBarGap);
window.addEventListener('orientationchange', () => setTimeout(fixBarGap, 300));
fixBarGap();
function fitVH() {
  const h = window.innerHeight;
  if (h !== lastVH) {
    lastVH = h;
    document.documentElement.style.setProperty('--vh', h + 'px');
  }
}
fitVH();
addEventListener('resize', fitVH);
addEventListener('orientationchange', () => setTimeout(fitVH, 250));
addEventListener('pageshow', fitVH);
if (window.visualViewport) visualViewport.addEventListener('resize', fitVH);
setTimeout(fitVH, 350);
setInterval(fitVH, 1000); // Drift-Absicherung (iOS meldet Höhe teils erst spät korrekt)

applyTheme();
renderAll();
checkReminders();
syncExternal(true);
setInterval(() => { if (currentTab === 'heute') renderHome(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderAll(); checkReminders(); syncExternal(false); } });

/* ================= Service Worker (nur gehostet) ================= */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
